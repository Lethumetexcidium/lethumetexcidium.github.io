<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Redirigiendo...</title>
    <!-- Asegúrate de que la ruta a revistas.js sea correcta -->
    <script src="revistas.js"></script>
    <script>
        window.onload = function() {
            console.log("Iniciando redirección...");

            // Verificamos si la base de datos cargó correctamente
            if (typeof revistas === 'undefined') {
                console.error("Error: No se encontró la variable 'revistas'. Revisa que revistas.js no tenga etiquetas <script>.");
                document.body.innerHTML = "Error al cargar la base de datos.";
                return;
            }

            // 1. Filtramos las revistas que tienen la categoría "ensayos"
            const revistasConCuentoss = revistas.filter(r => r.cuentos && Array.isArray(r.cuentos) && r.cuentos.length > 0);
            console.log("Revistas con cuentos encontradas:", revistasConCuentos.length);

            if (revistasConCuentos.length > 0) {
                // 2. Elegimos una revista al azar
                const revistaElegida = revistasConCuentos[Math.floor(Math.random() * revistasConCuentos.length)];
                
                // 3. Elegimos una página al azar
                const paginaElegida = revistaElegida.cuentos[Math.floor(Math.random() * revistaElegida.cuentos.length)];
                
                // 4. Construimos la URL final
                // Nota: Usamos window.location.replace para que el usuario no pueda volver atrás al redireccionador
                const urlFinal = revistaElegida.base + "/#p=" + paginaElegida;
                console.log("Redirigiendo a:", urlFinal);
                
                window.location.replace(urlFinal);
            } else {
                console.warn("No se encontraron cuentos disponibles.");
                document.body.innerHTML = "No hay cuentos disponibles en este momento.";
            }
        };
    </script>
</head>
<body>
    <p id="mensaje">Buscando un cuento para ti...</p>
</body>
</html>
