<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Redirigiendo...</title>
    <!-- Cargamos la base de datos y funciones existentes -->
    <script src="revistas.js"></script>
    <script>
        window.onload = function() {
            // 1. Filtramos las revistas que tienen la categoría "ensayos"
            const revistasConEnsayos = revistas.filter(r => r.ensayos && r.ensayos.length > 0);

            if (revistasConEnsayos.length > 0) {
                // 2. Elegimos una revista al azar de las que tienen ensayos
                const revistaElegida = elegir(revistasConEnsayos);
                
                // 3. Elegimos una página al azar de la lista de ensayos de esa revista
                const paginaElegida = elegir(revistaElegida.ensayos);
                
                // 4. Ejecutamos la redirección usando tu función existente
                redirigir(revistaElegida.base, paginaElegida);
            } else {
                console.error("No se encontraron ensayos en la base de datos.");
                // Opcional: Redirigir a index.html si no hay contenido
                // window.location.href = "index.html";
            }
        };
    </script>
</head>
<body>
    <p>Buscando un ensayo para ti...</p>
</body>
</html>
